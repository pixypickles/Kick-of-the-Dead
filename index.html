<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Kick of the Dead</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1>KICK OF THE DEAD</h1>
    </header>

    <section id="hud">
      <div>HP <span id="hp">5</span></div>
      <div>SCORE <span id="score">0</span></div>
      <div>SPECIAL <span id="specialText">0%</span></div>
    </section>

    <div id="specialBar"><div id="specialFill"></div></div>

    <section id="gameWrap">
      <canvas id="game" width="1280" height="720"></canvas>

      <div id="controls" aria-label="game controls">
        <div class="dpad">
          <button class="up" data-input="up">▲</button>
          <button class="left" data-input="left">◀</button>
          <button class="right" data-input="right">▶</button>
          <button class="down" data-input="down">▼</button>
        </div>

        <div class="actions">
          <button class="special" data-input="special">SPECIAL</button>
          <button class="jump" data-input="jump">JUMP</button>
          <button class="attack" data-input="attack">KICK</button>
        </div>
      </div>

      <div id="statusMessage"></div>

      <div id="overlay" class="hidden">
        <div class="panel">
          <h2>GAME OVER</h2>
          <p id="finalScore"></p>
          <button id="restart">RESTART</button>
        </div>
      </div>
    </section>

    <p class="help">←/→：向き　↑/↓＋KICK：上段/下段　JUMP：ジャンプ　空中KICK：回転蹴り</p>
  </main>
  <script src="main.js"></script>
</body>
</html>
